# LiminalGen Configuration
#
# This file holds GLOBAL settings only. Each level's configuration lives in
# its own file under plugins/LiminalGen/levels/ (level0.yml, level1.yml, ...),
# covering ring radii, elevation steps, room dimensions, materials, lighting,
# per-level loot tables, hazards, transition gradient overrides, and rail
# settings. Missing level files are recreated from the jar's defaults on
# startup; a legacy inline `levels:` section below is migrated into individual
# files once. Edits are picked up by /liminaladmin reload.
#
# == LEVEL LAYOUT: RIPPLE RINGS ==
# Levels are arranged as concentric rings around world spawn (0,0), like ripples
# spreading outward. Every chunk belongs to exactly ONE level, chosen by the
# chunk centre's distance from spawn (configured in each levels/*.yml file):
#
#   distance = sqrt(chunkCentreX^2 + chunkCentreZ^2)   (in blocks)
#
# A chunk matches a level when:  min-radius <= distance  and  distance < max-radius
# (max-radius: -1 means the ring extends to infinity).
#
# To add a new level, create levels/<id>.yml with unique ring radii tiling
# outward from the previous level. Levels without a dedicated generator
# subclass use the generic generator automatically.
#
# == LEVEL ELEVATION & TRANSITIONS ==
# Each level sits `elevation-step` blocks higher than the previous one, and the
# transition corridors between rings ramp smoothly between the two elevations:
# a sloped walkway (one block up every few steps, walkable and climbable by
# powered rails), material gradients, perimeter walls with doorways, support
# pillars, and ceiling lights.
# `generation.transition-width` controls the corridor width in blocks.
#
# Transition materials are AUTOMATIC by default: the generator interpolates the
# two levels' own materials in colour space and picks the nearest real blocks
# at each step of the ramp, so any level pairing works with zero configuration.
# To art-direct a specific transition, add an optional per-level override in
# that level's file (the gradient describes blending INTO that level from the
# previous one):
#   transition:
#     wall-gradient: [MAT_A, MAT_MID, MAT_B]
#     floor-gradient: [...]
#     ceiling-gradient: [...]
# Set `rails: true` on a level to have its inbound corridor climbable by rail.

liminal-world-name: "liminal"

gameplay:
  mob-spawning: true
  loot-generation: true     # master switch; each level's file also gates loot per level
  hazards: true             # master switch; each level's file also gates hazards per level
  hunger-enabled: true
  pvp: false
  difficulty: NORMAL
  spawn-monsters: false
  spawn-animals: false
  weather-enabled: false

bluemap:
  enabled: true
  markers: true
  overlays: true
  dedicated-map: true
  map-name: "Liminal"
  marker-sets:
    special-rooms:
      label: "Special Rooms"
      toggleable: true
      default-hidden: false
    hazards:
      label: "Hazards"
      toggleable: true
      default-hidden: false
    stairwells:
      label: "Stairwells"
      toggleable: true
      default-hidden: false
    loot:
      label: "Loot"
      toggleable: true
      default-hidden: true

generation:
  seed: 0
  grid-cell-size: 16
  transition-width: 40
  stairwell-chance: 0.02
