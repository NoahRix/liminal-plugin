# Level 0 - The Lobby
# Innermost ripple ring: classic birch rooms on 4 stacked floors with corner
# stairwells, sea-lantern lighting. Ships clean - no loot or hazards.

enabled: true
name: "Level 0 - The Lobby"

# Ring radii (blocks from spawn): fills the disc up to max-radius.
min-radius: 0
max-radius: 150

# Vertical offset; the floor surface sits at min-y + elevation-step + 1.
elevation-step: 0

min-y: -64
max-y: 0
ceiling-height: 4

room:
  min-width: 8
  max-width: 24
  min-length: 8
  max-length: 24
  wall-material: BIRCH_PLANKS
  floor-material: LIGHT_GRAY_CONCRETE
  ceiling-material: SMOOTH_STONE

lighting:
  material: SEA_LANTERN
  spacing: 5
  style: ceiling
  flicker-chance: 0.10

# Stacked structure: 4 floors connected by corner spiral stairwells.
layout:
  floors: 4
  floor-offset: 1
  doorway-height: 2
  stairwell:
    style: spiral
    chance: 0.15
    stairs: OAK_STAIRS
    cap-light: SEA_LANTERN

# Optional per-level transition gradient override (blending INTO this level).
# Leave commented to let the generator derive an automatic colour-space
# gradient from the two levels' own materials.
# transition:
#   wall-gradient: [MAT_A, MAT_MID, MAT_B]
#   floor-gradient: [...]
#   ceiling-gradient: [...]

# ---------------------------------------------------------------
# Loot: disabled out of the box - the lobby ships clean.
# Set enabled: true and uncomment `entries` to spawn loot containers.
# Each entry rolls independently when a container spawns: `chance`
# (0.0-1.0) to be included, amount random between min and max.
loot:
  enabled: false
  chance: 0.005       # per floor block - chance a loot container spawns
  container: CHEST    # CHEST or BARREL
  # entries:
  #   - material: BOOK
  #     min: 1
  #     max: 2
  #     chance: 0.5
  #   - material: CANDLE
  #     min: 1
  #     max: 3
  #     chance: 0.4
  #   - material: PAPER
  #     min: 2
  #     max: 6
  #     chance: 0.3

# ---------------------------------------------------------------
# Hazards: disabled out of the box - the lobby ships clean.
# Available types: WATER (puddle), FIRE (burn patch), COBWEB (2-high web).
# Uncomment `types` to restrict which hazards may spawn (default: all).
hazards:
  enabled: false
  chance: 0.003       # per floor block - chance a hazard spawns
  # types: [WATER, FIRE, COBWEB]
